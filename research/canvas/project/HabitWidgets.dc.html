<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairo Habit widgets, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
.k.dark{--primary:#A8C7FA;--on-primary:#062E6F;--primary-container:#0842A0;--on-primary-container:#D3E3FD;--secondary:#7FCFFF;--secondary-container:#004A77;--on-secondary-container:#C2E7FF;--tertiary:#6DD58C;--tertiary-container:#0F5223;--on-tertiary-container:#C4EED0;--error:#FF9F99;--error-container:#D7383B;--on-error-container:#FFFFFF;--inverse-surface:#E2E2E2;--inverse-on-surface:#1B1B1B;--inverse-primary:#0B57D0;--on-surface:#FFFFFF;--on-surface-variant:#C6C6C6;--outline-variant:#474747;--bg:#0E0E0E;--nav-bg:#2A2A2A;--chip:#2A2A2A;--search-bg:#262626;--item:#1F1F1F;--item-press:#2A2A2A}
.k.light{--primary:#0B57D0;--on-primary:#FFFFFF;--primary-container:#D3E3FD;--on-primary-container:#041E49;--secondary:#00639B;--secondary-container:#C2E7FF;--on-secondary-container:#001D35;--tertiary:#146C2E;--tertiary-container:#C4EED0;--on-tertiary-container:#072711;--error:#B31B25;--error-container:#D7383B;--on-error-container:#FFFFFF;--inverse-surface:#303030;--inverse-on-surface:#F1F1F1;--inverse-primary:#A8C7FA;--on-surface:#1B1B1B;--on-surface-variant:#474747;--outline-variant:#C6C6C6;--bg:#F1F1F1;--nav-bg:#FFFFFF;--chip:#E2E2E2;--search-bg:#E2E2E2;--item:#FFFFFF;--item-press:#E8E8E8}
.k{--fs:358ms linear(0,0.044,0.153,0.298,0.454,0.607,0.744,0.858,0.949,1.014,1.058,1.084,1.094,1.093,1.085,1.072,1.058,1.043,1.029,1.018,1.008,1.001,0.996,0.993,0.991,0.991,0.992,0.993,0.994,0.995,0.997,0.998,1);--ds:434ms linear(0,0.03,0.105,0.205,0.315,0.426,0.532,0.627,0.711,0.782,0.841,0.889,0.926,0.955,0.976,0.992,1.002,1.009,1.013,1.015,1.015,1.015,1.013,1.012,1.01,1.008,1.007,1.005,1.004,1.003,1.002,1.002,1);--fe:148ms linear(0,0.034,0.112,0.211,0.316,0.417,0.51,0.593,0.665,0.726,0.777,0.82,0.856,0.884,0.908,0.927,0.942,0.954,0.964,0.972,0.978,0.982,0.986,0.989,0.992,0.993,0.995,0.996,0.997,0.998,0.998,0.999,1);--de:230ms linear(0,0.034,0.114,0.214,0.319,0.421,0.514,0.597,0.669,0.73,0.781,0.824,0.859,0.887,0.91,0.929,0.944,0.956,0.965,0.973,0.979,0.983,0.987,0.99,0.992,0.994,0.995,0.996,0.997,0.998,0.998,0.999,1)}
.k button{font:inherit;-webkit-tap-highlight-color:transparent}
.k button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none}
/* Home-screen grid: 4 columns, 92dp rows, 12dp gaps. Widget corners 28dp (launcher-set system_app_widget_background_radius) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:92px;gap:12px}
.w{background:var(--item);border-radius:28px;box-sizing:border-box;position:relative;overflow:hidden;animation:fadeUp var(--ds) both;color:var(--on-surface)}
.c4{grid-column:span 4}.c2{grid-column:span 2}.r2{grid-row:span 2}
.k.dark{--hon:#1B1B1B}.k.light{--hon:#FFFFFF}
/* Habit widgets (owner, 2026-11-27): the habit shape is the check, as on the Habits tab (outline = to do, fill = done, a count or timer fills from the bottom) */
.hw{padding:16px 8px 12px 8px;display:flex;flex-direction:column}
.hw .hd{display:flex;align-items:baseline;gap:8px;padding:0 12px}
.hw .tt{font-size:22px;line-height:28px;font-weight:500}
.hw .tn{font-size:14px;line-height:20px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.hgrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;gap:4px;margin-top:16px}
.hcell{border:0;padding:4px 0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--on-surface-variant);font-size:12px;line-height:16px;font-weight:500;min-width:0}
.hcell .nm{max-width:100%;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hs{width:52px;height:52px;position:relative;display:grid;place-items:center;color:var(--hc);transition:transform var(--fs)}
.hs svg{position:absolute;inset:0;width:52px;height:52px;overflow:visible}
.hs .hl{fill:none;stroke:var(--hc);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs .hpf{fill:var(--hc);opacity:.35}
.hs .hf{fill:var(--hc);opacity:0;transform-origin:50px 50px;transform:scale(.6);transition:opacity var(--fe),transform var(--fs)}
.hs .ms{position:relative;font-size:22px;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24}
.hs.on .hf{opacity:1;transform:none}
.hs.on .hpf{opacity:0}
.hs.on .ms{color:var(--hon);font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.hs.no{color:var(--on-surface-variant)}
.hs.no .hl{stroke:var(--on-surface-variant);stroke-dasharray:5 4}
.hcell:active .hs,.one .big:active .hs{transform:scale(.88)}
/* One habit 2x2: the big shape, its name and today's amount */
.one{padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.one .big{border:0;padding:0;background:none;cursor:pointer}
.one .hs{width:96px;height:96px}
.one .hs svg{width:96px;height:96px}
.one .hs .ms{font-size:36px;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 40}
.one .hs.on .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 40}
.one .nm{font-size:16px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.one .am{font-size:14px;line-height:18px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="k {{themeClass}}" style="width: 390px; height: 500px; box-sizing: border-box; padding: 48px 16px; background: var(--bg); color: var(--on-surface); font-family: 'Google Sans Flex', 'Roboto Flex', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div class="grid">
    <section class="w c4 r2 hw" aria-label="Habits today" style="animation-delay: 0ms">
      <div class="hd"><span class="tt">Habits</span><span class="tn">{{doneN}} of {{dueN}}</span></div>
      <div class="hgrid">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="5">
          <button class="hcell" aria-label="{{c.aria}}" onClick="{{c.tap}}" style="--hc: {{c.color}}">
            <span class="{{c.cls}}">
              <svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="wcl-{{c.key}}"><rect x="-5" y="{{c.fillY}}" width="110" height="110"></rect></clipPath></defs><path class="hpf" clip-path="url(#wcl-{{c.key}})" d="{{c.path}}"></path><path class="hf" d="{{c.path}}"></path><path class="hl" d="{{c.path}}"></path></svg>
              <span class="ms" aria-hidden="true">{{c.icon}}</span>
            </span>
            <span class="nm">{{c.name}}</span>
          </button>
        </sc-for>
      </div>
    </section>
    <sc-for list="{{ones}}" as="o" hint-placeholder-count="2">
      <section class="w c2 r2 one" aria-label="{{o.name}}" style="animation-delay: {{o.delay}}; --hc: {{o.color}}">
        <button class="big" aria-label="{{o.aria}}" onClick="{{o.tap}}">
          <span class="{{o.cls}}">
            <svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="wco-{{o.key}}"><rect x="-5" y="{{o.fillY}}" width="110" height="110"></rect></clipPath></defs><path class="hpf" clip-path="url(#wco-{{o.key}})" d="{{o.path}}"></path><path class="hf" d="{{o.path}}"></path><path class="hl" d="{{o.path}}"></path></svg>
            <span class="ms" aria-hidden="true">{{o.icon}}</span>
          </span>
        </button>
        <span class="nm">{{o.name}}</span>
        <span class="am">{{o.amount}}</span>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":500}}'>
class Component extends DCLogic {
  // Official MaterialShapes paths (from "Shape Set.svg", normalized to 0–100), the same ones the Habits tab uses
  m3(name) { return ({"Circle": "M100 50C100 77.61 77.61 100 50 100C22.39 100 0 77.61 0 50C0 22.39 22.39 0 50 0C77.61 0 100 22.39 100 50Z", "Slanted": "M4.91 28.29C5.72 20.61 6.12 16.77 7.59 13.74C9.73 9.36 13.46 5.97 18.01 4.29C21.15 3.12 24.98 3.12 32.63 3.12H71.29C80.55 3.12 85.18 3.12 88.72 4.64C93.83 6.84 97.73 11.20 99.35 16.57C100.47 20.27 99.99 24.92 99.02 34.21L95.09 71.71C94.28 79.39 93.88 83.23 92.41 86.26C90.27 90.64 86.54 94.03 81.99 95.71C78.85 96.88 75.02 96.88 67.37 96.88H28.71C19.45 96.88 14.82 96.88 11.28 95.36C6.17 93.16 2.27 88.80 0.65 83.43C-0.48 79.73 0.01 75.08 0.98 65.79L4.91 28.29Z", "Sunny": "M77.02 12.13C80.13 12.34 81.68 12.45 82.94 13C84.76 13.79 86.21 15.24 87 17.06C87.55 18.32 87.66 19.87 87.87 22.98L88.35 30.08C88.44 31.34 88.48 31.97 88.62 32.57C88.82 33.44 89.16 34.27 89.63 35.02C89.96 35.54 90.38 36.02 91.20 36.97L95.88 42.33C97.93 44.67 98.96 45.85 99.46 47.12C100.18 48.97 100.18 51.03 99.46 52.88C98.96 54.15 97.93 55.33 95.88 57.67L91.20 63.03C90.38 63.98 89.96 64.46 89.63 64.98C89.16 65.73 88.82 66.56 88.62 67.43C88.48 68.03 88.44 68.66 88.35 69.92L87.87 77.02C87.66 80.13 87.55 81.68 87 82.94C86.21 84.76 84.76 86.21 82.94 87C81.68 87.55 80.13 87.66 77.02 87.87L69.92 88.35C68.66 88.44 68.03 88.48 67.43 88.62C66.56 88.82 65.73 89.16 64.98 89.63C64.46 89.96 63.98 90.38 63.03 91.21L57.68 95.88C55.33 97.93 54.15 98.96 52.88 99.46C51.03 100.18 48.97 100.18 47.12 99.46C45.85 98.96 44.67 97.93 42.32 95.88L36.97 91.21C36.02 90.38 35.54 89.96 35.02 89.63C34.27 89.16 33.44 88.82 32.57 88.62C31.97 88.48 31.34 88.44 30.08 88.35L22.98 87.87C19.87 87.66 18.32 87.55 17.06 87C15.24 86.21 13.79 84.76 13 82.94C12.45 81.68 12.34 80.13 12.13 77.02L11.65 69.92C11.56 68.66 11.52 68.03 11.38 67.43C11.18 66.56 10.84 65.73 10.37 64.98C10.04 64.46 9.62 63.98 8.80 63.03L4.12 57.67C2.07 55.33 1.04 54.15 0.54 52.88C-0.18 51.03 -0.18 48.97 0.54 47.12C1.04 45.85 2.07 44.67 4.12 42.33L8.80 36.97C9.62 36.02 10.04 35.54 10.37 35.02C10.84 34.27 11.18 33.44 11.38 32.57C11.52 31.97 11.56 31.34 11.65 30.08L12.13 22.98C12.34 19.87 12.45 18.32 13 17.06C13.79 15.24 15.24 13.79 17.06 13C18.32 12.45 19.87 12.34 22.98 12.13L30.08 11.65C31.34 11.56 31.97 11.52 32.57 11.38C33.44 11.18 34.27 10.84 35.02 10.37C35.54 10.04 36.02 9.62 36.97 8.79L42.32 4.12C44.67 2.07 45.85 1.04 47.12 0.54C48.97 -0.18 51.03 -0.18 52.88 0.54C54.15 1.04 55.33 2.07 57.68 4.12L63.03 8.79C63.98 9.62 64.46 10.04 64.98 10.37C65.73 10.84 66.56 11.18 67.43 11.38C68.03 11.52 68.66 11.56 69.92 11.65L77.02 12.13Z", "Gem": "M31.24 8.54C37.07 4.31 39.98 2.19 43.08 1.14C47.57 -0.38 52.43 -0.38 56.92 1.14C60.02 2.19 62.93 4.31 68.76 8.54L81.85 18.05C85.31 20.56 87.04 21.81 88.45 23.32C90.48 25.50 92.05 28.08 93.03 30.89C93.72 32.84 94.03 34.95 94.66 39.18L97.08 55.52C98.19 62.94 98.73 66.65 98.18 69.99C97.38 74.82 94.95 79.24 91.30 82.51C88.78 84.77 85.35 86.30 78.50 89.35L62.99 96.26C58.85 98.10 56.79 99.02 54.66 99.49C51.59 100.17 48.41 100.17 45.34 99.49C43.21 99.02 41.15 98.10 37.01 96.26L21.50 89.35C14.65 86.30 11.22 84.77 8.70 82.51C5.05 79.24 2.62 74.82 1.82 69.99C1.27 66.65 1.82 62.94 2.92 55.52L5.34 39.18C5.97 34.95 6.28 32.84 6.97 30.89C7.95 28.08 9.52 25.50 11.55 23.32C12.96 21.81 14.69 20.56 18.15 18.05L31.24 8.54Z", "Pill": "M26.62 12.59C43.41 -4.20 70.62 -4.20 87.41 12.59C104.20 29.38 104.20 56.59 87.41 73.38L73.38 87.41C56.59 104.20 29.38 104.20 12.59 87.41C-4.20 70.62 -4.20 43.41 12.59 26.62L26.62 12.59Z", "Pentagon": "M38.79 5.16C45.47 0.30 54.53 0.30 61.21 5.16L92.14 27.63C98.82 32.48 101.62 41.09 99.07 48.95L87.25 85.31C84.70 93.17 77.38 98.49 69.12 98.49H30.88C22.62 98.49 15.30 93.17 12.75 85.31L0.93 48.95C-1.62 41.09 1.18 32.48 7.86 27.63L38.79 5.16Z"})[name]; }
  componentDidMount() { this._t = setInterval(() => { if ((this.state || {}).run) this.setState({ tick: Date.now() }); }, 1000); }
  renderVals() {
    const s = this.state || {};
    const theme = this.props.theme ?? 'dark', dark = theme === 'dark';
    const C = dark ? { Teal: '#5DD9D8', Violet: '#D7BAFF', Coral: '#FFB4A1', Pink: '#FFB0CE', Indigo: '#B9C3FF' }
      : { Teal: '#006A6A', Violet: '#753FC1', Coral: '#AB3514', Pink: '#AE236D', Indigo: '#3351D3' };
    // Same sample day as the Habits boards: today's due habits (Journal is paused, so it isn't shown)
    const H = [
      { id: 1, name: 'Drink water', icon: 'water_drop', shape: 'Circle', color: 'Teal', goal: 'count', target: 8, step: 1, unit: 'glasses', v0: 5 },
      { id: 2, name: 'Meditate', icon: 'self_improvement', shape: 'Slanted', color: 'Violet', goal: 'time', target: 10, unit: 'min', v0: 4 },
      { id: 3, name: 'Gym', icon: 'fitness_center', shape: 'Sunny', color: 'Coral', goal: 'yes', v0: 1 },
      { id: 5, name: 'No sugar', icon: 'no_food', shape: 'Gem', color: 'Pink', goal: 'yes', v0: 'no' },
      { id: 7, name: 'Run', icon: 'directions_run', shape: 'Pill', color: 'Indigo', goal: 'yes', v0: 0 }
    ];
    const vals = s.vals || {};
    const run = s.run || null; // Meditate timer: { start, base }
    const val = h => { if (h.goal === 'time' && run) return Math.min(h.target, run.base + (Date.now() - run.start) / 60000); return vals[h.id] !== undefined ? vals[h.id] : h.v0; };
    const isDone = h => { const v = val(h); return h.goal === 'yes' ? v === 1 : typeof v === 'number' && v >= h.target; };
    const frac = h => h.goal === 'yes' ? 0 : Math.min(1, (typeof val(h) === 'number' ? val(h) : 0) / h.target);
    const set = (h, v) => this.setState({ vals: { ...vals, [h.id]: v } });
    // A tap does what tapping the habit does in the app: yes/no toggles, a count adds one step (resets when full), a time habit starts or pauses its timer
    const tap = h => {
      const v = val(h), d = isDone(h);
      if (h.goal === 'yes') return set(h, d ? 0 : 1);
      if (h.goal === 'count') return set(h, d ? 0 : Math.min(h.target, (typeof v === 'number' ? v : 0) + h.step));
      if (run) { this.setState({ run: null, vals: { ...vals, [h.id]: Math.round(val(h) * 10) / 10 } }); return; }
      if (d) return set(h, 0);
      this.setState({ run: { start: Date.now(), base: typeof v === 'number' ? v : 0 } });
    };
    const fmt = n => (Math.round(n * 10) / 10).toLocaleString('en-IN');
    const mmss = m => { const t = Math.floor(m * 60); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
    const vis = h => { const d = isDone(h), no = val(h) === 'no', r = h.goal === 'time' && !!run;
      return { key: h.id, name: h.name, color: C[h.color], path: this.m3(h.shape), cls: 'hs' + (d ? ' on' : no ? ' no' : ''),
        icon: no ? 'close' : r ? 'pause' : h.icon, fillY: (100 - (d || no ? 0 : frac(h)) * 100).toFixed(1), tap: () => tap(h) }; };
    const amount = h => { const v = val(h);
      if (h.goal === 'time') return run ? 'Running · ' + mmss(v) : isDone(h) ? 'Done · ' + h.target + ' min' : fmt(v) + ' of ' + h.target + ' min';
      if (h.goal === 'count') return isDone(h) ? 'Done · ' + h.target + ' ' + h.unit : fmt(v) + ' of ' + h.target + ' ' + h.unit;
      return isDone(h) ? 'Done' : 'To do'; };
    const doneN = H.filter(isDone).length;
    return {
      themeClass: theme, doneN, dueN: H.length,
      cells: H.map(h => ({ ...vis(h), aria: h.name + ', ' + amount(h) })),
      ones: [H[0], H[1]].map((h, i) => ({ ...vis(h), key: 'o' + h.id, delay: (80 + i * 40) + 'ms', amount: amount(h),
        aria: (h.goal === 'count' ? (isDone(h) ? 'Reset ' : 'Add 1 to ') : run ? 'Pause timer for ' : 'Start timer for ') + h.name }))
    };
  }
}

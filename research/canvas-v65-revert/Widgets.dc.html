<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairo Widgets, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
.k.dark{--primary:#63CCFF;--on-primary:#00374B;--primary-container:#00C1FF;--on-primary-container:#002B3D;--secondary:#69C1FF;--secondary-container:#007BB5;--on-secondary-container:#FFFFFF;--tertiary:#AEB2FF;--tertiary-container:#8D94FF;--on-tertiary-container:#01004D;--error:#FF9F99;--error-container:#D7383B;--on-error-container:#FFFFFF;--inverse-surface:#E2E2E2;--inverse-on-surface:#1B1B1B;--inverse-primary:#005C7B;--on-surface:#FFFFFF;--on-surface-variant:#C6C6C6;--outline-variant:#474747;--bg:#0E0E0E;--nav-bg:#2A2A2A;--chip:#2A2A2A;--search-bg:#262626;--item:#1F1F1F;--item-press:#2A2A2A}
.k.light{--primary:#006384;--on-primary:#FFFFFF;--primary-container:#007DA7;--on-primary-container:#FFFFFF;--secondary:#00618F;--secondary-container:#007BB5;--on-secondary-container:#FFFFFF;--tertiary:#4A50B7;--tertiary-container:#636AD2;--on-tertiary-container:#FFFFFF;--error:#B31B25;--error-container:#D7383B;--on-error-container:#FFFFFF;--inverse-surface:#303030;--inverse-on-surface:#F1F1F1;--inverse-primary:#63CCFF;--on-surface:#1B1B1B;--on-surface-variant:#474747;--outline-variant:#C6C6C6;--bg:#F1F1F1;--nav-bg:#FFFFFF;--chip:#E2E2E2;--search-bg:#E2E2E2;--item:#FFFFFF;--item-press:#E8E8E8}
.k{--fs:358ms linear(0,0.044,0.153,0.298,0.454,0.607,0.744,0.858,0.949,1.014,1.058,1.084,1.094,1.093,1.085,1.072,1.058,1.043,1.029,1.018,1.008,1.001,0.996,0.993,0.991,0.991,0.992,0.993,0.994,0.995,0.997,0.998,1);--ds:434ms linear(0,0.03,0.105,0.205,0.315,0.426,0.532,0.627,0.711,0.782,0.841,0.889,0.926,0.955,0.976,0.992,1.002,1.009,1.013,1.015,1.015,1.015,1.013,1.012,1.01,1.008,1.007,1.005,1.004,1.003,1.002,1.002,1);--fe:148ms linear(0,0.034,0.112,0.211,0.316,0.417,0.51,0.593,0.665,0.726,0.777,0.82,0.856,0.884,0.908,0.927,0.942,0.954,0.964,0.972,0.978,0.982,0.986,0.989,0.992,0.993,0.995,0.996,0.997,0.998,0.998,0.999,1);--de:230ms linear(0,0.034,0.114,0.214,0.319,0.421,0.514,0.597,0.669,0.73,0.781,0.824,0.859,0.887,0.91,0.929,0.944,0.956,0.965,0.973,0.979,0.983,0.987,0.99,0.992,0.994,0.995,0.996,0.997,0.998,0.998,0.999,1)}
.k button{font:inherit;-webkit-tap-highlight-color:transparent}
.k button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
/* Home-screen grid: 4 columns, 92dp rows, 12dp gaps. Widget corners 28dp (launcher-set system_app_widget_background_radius; 28dp is the upper bound) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:92px;gap:12px}
.w{background:var(--item);border-radius:28px;box-sizing:border-box;position:relative;overflow:hidden;animation:fadeUp var(--ds) both;color:var(--on-surface)}
.c4{grid-column:span 4}.c2{grid-column:span 2}.c1{grid-column:span 1}.r2{grid-row:span 2}
.ib{width:48px;height:48px;flex:none;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--on-surface-variant)}
.ib .face{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;background:var(--chip);transition:border-radius var(--fs)}
.ib:active .face{border-radius:8px}
/* Quick add 4x1: Pill */
.qa{display:flex;align-items:center;gap:0;padding:0 12px 0 18px;border-radius:46px}
.qa .logo{width:40px;height:40px;flex:none;position:relative;display:grid;place-items:center}
.qa .logo svg{position:absolute;inset:0;width:40px;height:40px}
.qa .logo .ms{position:relative;font-size:22px;color:var(--on-primary);font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 24}
.qa .hint{flex:1;min-width:0;height:56px;border:0;border-radius:28px;background:var(--search-bg);color:var(--on-surface-variant);text-align:left;padding:0 20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;letter-spacing:.15px;cursor:pointer;margin-right:4px;transition:border-radius var(--fs)}
.qa .hint:active{border-radius:12px}
/* Today 4x2 */
.today{padding:14px 12px 12px 16px;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;align-items:center;gap:8px}
.thead .tt{font-size:22px;line-height:28px;font-weight:500}
.thead .tn{flex:1;font-size:14px;line-height:20px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.addb{width:48px;height:48px;border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;transition:border-radius var(--fs)}
.addb .ms{font-size:28px;font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 24}
.addb:active{border-radius:24px}
.tlist{display:flex;flex-direction:column;gap:2px}
.trow{height:38px;display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:6px;padding:0 14px 0 6px;transition:opacity var(--fe)}
.trow.first{border-radius:16px 16px 6px 6px}.trow.last{border-radius:6px 6px 16px 16px}
.chk{width:32px;height:32px;flex:none;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer}
.chk i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ring);display:grid;place-items:center;transition:border-radius var(--fs),background-color var(--fe),box-shadow var(--fe)}
.chk .ms{font-size:16px;color:var(--on-primary);opacity:0;font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 20}
.trow.done .chk i{background:var(--primary);box-shadow:none;border-radius:6px}
.trow.done .chk .ms{opacity:1}
.trow .tx{flex:1;min-width:0;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .tx{text-decoration:line-through;color:var(--on-surface-variant)}
.trow .tm{font-size:12px;line-height:16px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
/* Shaped widgets: the widget IS an official MaterialShapes outline (SemiCircle, Arch, Ghostish, Cookie-12, Sunny), stretched to its bounds like toShape() */
.w.shp{background:none;overflow:visible}
.wbg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;overflow:visible}
.wbg.spin{animation:spin 40s linear infinite}
.shp > *:not(.wbg){position:relative;z-index:1}
/* Progress 2x2: Cookie-12 */
.prog{display:grid;place-items:center;color:var(--on-primary-container)}
.ringwrap{width:120px;height:120px;position:relative;display:grid;place-items:center}
.ringwrap svg{position:absolute;inset:0;width:120px;height:120px}
.ring path{transition:d var(--ds)}
.cnt{position:relative;display:flex;flex-direction:column;align-items:center;font-size:32px;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt small{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;opacity:.8}
/* Timer 2x2: Ghostish (round top, scalloped hem) */
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 18px 30px;color:var(--on-tertiary-container)}
.timer .ft{font-size:36px;line-height:44px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px}
.timer .task{max-width:100%;font-size:12px;line-height:16px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:4px;width:100%;margin-top:8px}
.tb{height:40px;border:0;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-radius var(--fs)}
.tb .ms{font-size:22px;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.tb.stop{width:48px;flex:none;background:color-mix(in srgb,var(--on-tertiary-container) 14%,transparent);color:var(--on-tertiary-container)}
.tb.go{flex:1;background:var(--primary);color:var(--on-primary)}
.tb:active{border-radius:8px}
/* Next up 2x1: plain widget, 28dp corners (owner: SemiCircle was a bad fit) */
.next{display:flex;flex-direction:column;justify-content:center;padding:0 18px}
.next .when{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px;color:var(--primary);font-variant-numeric:tabular-nums}
.next .nt{max-width:100%;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .nm{font-size:12px;line-height:16px;color:var(--on-surface-variant);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.ldot{width:8px;height:8px;border-radius:50%;flex:none}
/* Streak 1x1: Sunny */
.streak{display:grid;place-items:center}
.streak .sh{width:80px;height:80px;position:relative;display:grid;place-items:center}
.streak svg{position:absolute;inset:0;width:80px;height:80px;animation:spin 40s linear infinite}
.streak .sn{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--on-primary-container);font-variant-numeric:tabular-nums}
.streak .sn b{font-size:24px;line-height:26px;font-weight:700}
.streak .sn span{font-size:10px;line-height:12px;font-weight:600;letter-spacing:.4px}
/* Money 2x2: Arch (round top, flat base) */
.money{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px 14px}
.money .ml{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px;color:var(--on-surface-variant)}
.money .mv{font-size:26px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.money .mbar{width:100%;height:12px;margin-top:8px;overflow:visible}
.money .mb{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin-top:4px;font-variant-numeric:tabular-nums}
.money .eb{margin-top:auto;width:100%;height:40px;border:0;border-radius:20px;background:var(--chip);color:var(--on-surface);font-size:14px;font-weight:600;letter-spacing:.1px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:border-radius var(--fs)}
.money .eb .ms{font-size:20px;color:var(--primary)}
.money .eb:active{border-radius:8px}
/* Quick actions 4x1 (owner: pill was too curvy): plain 28dp widget, connected button group with 20dp outer / 8dp inner corners */
.qact{padding:8px;display:flex;gap:2px}
.qb{flex:1;border:0;border-radius:8px;background:var(--chip);color:var(--on-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:border-radius var(--fs),flex-grow var(--fs)}
.qb:first-child{border-radius:20px 8px 8px 20px}.qb:last-child{border-radius:8px 20px 20px 8px}
.qb:active{flex-grow:1.25;border-radius:12px}
.qb .ms{font-size:24px}
.qb.main{background:var(--primary);color:var(--on-primary)}
.qb.main .ms{font-variation-settings:"FILL" 0,"wght" 700,"GRAD" 0,"opsz" 24}
/* Stats 4x2 */
.stats{padding:16px 16px 14px 18px;display:flex;gap:10px;overflow:hidden}
.sl{flex:1;min-width:0;display:flex;flex-direction:column}
.sl .ml{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px;color:var(--on-surface-variant)}
.sl .big{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.sl .big small{font-size:16px;font-weight:500;color:var(--on-surface-variant)}
.sl .up{display:flex;align-items:center;gap:4px;font-size:14px;line-height:20px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.sl .up .ms{font-size:18px}
.chips{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--chip);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start;white-space:nowrap;max-width:100%;box-sizing:border-box}
.chip .ms{font-size:16px;color:var(--primary);font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 20}
.bars{width:150px;flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:6px;align-items:end;padding-bottom:20px;position:relative}
.bar{width:100%;border-radius:8px;background:color-mix(in srgb,var(--primary) 30%,transparent);position:relative;animation:grow var(--ds) both;transform-origin:bottom}
.bar.now{background:var(--primary)}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;line-height:16px;font-weight:600;color:var(--on-surface-variant)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none}
</style>
</helmet>
<div class="k {{themeClass}}" style="width: 390px; height: 1124px; box-sizing: border-box; padding: 48px 16px; background: var(--bg); color: var(--on-surface); font-family: 'Google Sans Flex', 'Roboto Flex', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div class="grid">

    <section class="w c4 qa" aria-label="Kairo quick add" style="animation-delay: 0ms">
      <button class="hint" aria-label="Add a task">Add a task</button>
      <button class="ib" aria-label="Add by voice"><span class="face"><span class="ms">mic</span></span></button>
      <button class="ib" aria-label="Add expense"><span class="face"><span class="ms">receipt_long</span></span></button>
      <button class="ib" aria-label="Start focus"><span class="face"><span class="ms">timer</span></span></button>
    </section>

    <section class="w c4 r2 today" aria-label="Today's tasks" style="animation-delay: 40ms">
      <div class="thead">
        <span class="tt">Today</span>
        <span class="tn">{{doneN}} of {{totalN}} done</span>
        <button class="addb" aria-label="Add a task"><span class="ms">add</span></button>
      </div>
      <div class="tlist" role="list">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <div class="trow {{r.cls}}" role="listitem" style="--ring: {{r.ring}}">
            <button class="chk" role="checkbox" aria-checked="{{r.checked}}" aria-label="{{r.aria}}" onClick="{{r.toggle}}"><i><span class="ms">check</span></i></button>
            <span class="tx">{{r.title}}</span>
            <span class="tm">{{r.time}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section class="w c2 r2 prog shp" aria-label="{{progAria}}" style="animation-delay: 80ms">
      <svg class="wbg spin" viewBox="0 0 100 100" aria-hidden="true" style="top: 11px; height: 173px"><path style="fill: var(--primary-container)" d="{{cookie12}}"></path></svg>
      <div class="ringwrap" aria-hidden="true">
        <svg class="ring" viewBox="0 0 120 120">
          <path d="{{trackPath}}" style="fill: none; stroke: var(--on-primary-container); stroke-opacity: 0.24; stroke-width: 8; stroke-linecap: round"></path>
          <path d="{{wavePath}}" style="fill: none; stroke: var(--on-primary-container); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round"></path>
        </svg>
        <span class="cnt">{{leftN}}<small>left</small></span>
      </div>
    </section>

    <section class="{{timerCls}}" aria-label="Focus timer" style="animation-delay: 120ms">
      <svg class="wbg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path style="fill: var(--tertiary-container)" d="{{ghost}}"></path></svg>
      <span class="ft" role="timer">{{timeLeft}}</span>
      <span class="task">{{timerTask}}</span>
      <div class="tbtns">
        <button class="tb stop" aria-label="Stop focus" onClick="{{stop}}"><span class="ms">stop</span></button>
        <button class="tb go" aria-label="{{goAria}}" onClick="{{toggle}}"><span class="ms">{{goIcon}}</span></button>
      </div>
    </section>

    <section class="w c2 r2 money shp" aria-label="Money this month" style="animation-delay: 160ms">
      <svg class="wbg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path style="fill: var(--item)" d="{{arch}}"></path></svg>
      <span class="ml">Spent in {{month}}</span>
      <span class="mv">₹18,450</span>
      <svg class="mbar" viewBox="0 0 141 12" preserveAspectRatio="none" aria-hidden="true">
        <path d="{{moneyWave}}" style="fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round"></path>
        <path d="M95 6 L139 6" style="fill: none; stroke: var(--primary); stroke-opacity: 0.24; stroke-width: 4; stroke-linecap: round"></path>
      </svg>
      <span class="mb">62% of ₹30,000</span>
      <button class="eb"><span class="ms">add</span>Expense</button>
    </section>

    <section class="w c2 next" aria-label="Next up" style="animation-delay: 200ms">
      <span class="when">{{nextWhen}}</span>
      <span class="nt">{{nextTitle}}</span>
      <span class="nm"><span class="ldot" style="background: {{nextColor}}"></span>{{nextMeta}}</span>
    </section>

    <section class="w c1 streak shp" aria-label="12-day streak" style="animation-delay: 240ms">
      <div class="sh"><svg viewBox="0 0 100 100" aria-hidden="true"><path style="fill: var(--primary-container)" d="{{sunny}}"></path></svg><span class="sn"><b>12</b><span>DAYS</span></span></div>
    </section>

    <section class="w c4 qact" role="toolbar" aria-label="Quick actions" style="animation-delay: 280ms">
      <button class="qb main"><span class="ms">add_task</span>Task</button>
      <button class="qb"><span class="ms">receipt_long</span>Expense</button>
      <button class="qb"><span class="ms">south_west</span>Income</button>
      <button class="qb"><span class="ms">timer</span>Focus</button>
    </section>

    <section class="w c4 r2 stats" aria-label="This week" style="animation-delay: 320ms">
      <div class="sl">
        <span class="ml">This week</span>
        <span class="big">34<small> done</small></span>
        <span class="up"><span class="ms">trending_up</span>12% vs last week</span>
        <div class="chips">
          <span class="chip"><span class="ms">local_fire_department</span>12-day streak</span>
          <span class="chip"><span class="ms">schedule</span>86% on time</span>
        </div>
      </div>
      <div class="bars" role="img" aria-label="Tasks done each day this week">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div class="{{b.cls}}" style="height: {{b.h}}px; animation-delay: {{b.delay}}"><span>{{b.d}}</span></div>
        </sc-for>
      </div>
    </section>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"clock":{"editor":"enum","options":["12-hour","24-hour"],"default":"12-hour"},"$preview":{"width":390,"height":1124}}'>
class Component extends DCLogic {
  // Official Material 3 Expressive shapes (MaterialShapes), path data copied from the M3 "Shape Set" SVG in the repo root,
  // scaled into a 0–100 box like RoundedPolygon.normalized(). '...Fill' = scaled to fill the box (a widget's bounds, like toShape()).

  ring(p) {
    const cx = 60, cy = 60, R = 48, A = 2.4, N = 16, steps = 96, gap = 14;
    const pt = deg => { const a = deg * Math.PI / 180; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; };
    const end = Math.max(p, 0.002) * 360;
    let wave = '';
    for (let i = 0; i <= steps; i++) {
      const deg = -90 + end * i / steps, a = deg * Math.PI / 180, taper = Math.min(1, i / 8, (steps - i) / 8);
      const r = R + A * taper * Math.sin(N * (a + Math.PI / 2));
      wave += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2);
    }
    let track = '';
    if (p < 1) {
      const s = -90 + end + (p > 0 ? gap : 0), e = 270 - (p > 0 ? gap : 0.01);
      const [x1, y1] = pt(s), [x2, y2] = pt(Math.max(e, s + 0.01));
      track = 'M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + 'A' + R + ' ' + R + ' 0 ' + ((e - s) > 180 ? 1 : 0) + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2);
    }
    return { wave: p > 0 ? wave : '', track };
  }

      { id: 7, title: 'Read 20 pages', time: '21:00', prio: 'low', list: 'Reading', color: 'Violet' }

    const done = s.done || {};
    const doneN = 3 + Object.keys(done).filter(k => done[k]).length, totalN = 10;
    const ring = { high: 'var(--error)', med: C.Amber, low: C.Indigo };

      aria: (done[t.id] ? 'Mark not done: ' : 'Complete: ') + t.title, toggle: () => this.setState({ done: { ...done, [t.id]: !done[t.id] } }) }));

      stop: () => this.setState({ stopped: true, paused: false }),
      month: now.toLocaleDateString('en-GB', { month: 'short' }), moneyWave: mw,
